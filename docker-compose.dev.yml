# ============================================================
# DEV-окружение с hot-reload
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f backend
#
#   Strapi  : http://localhost:1338/admin
#   Frontend: http://localhost:3001
#   Postgres: localhost:5433 (внутри контейнера 5432)
#
# Полностью изолировано от docker-compose.yml:
#   проект gamedoor-dev, свои тома БД и загрузок, свои node_modules,
#   хостовые порты 1338/3001/5433 вместо 1337/3000/5432.
# Оба стека могут работать одновременно, тома и данные не пересекаются.
# ============================================================
name: gamedoor-dev

services:
  postgres:
    # Та же мажорная версия, что в prod и на локальной машине - иначе дамп
    # нельзя положить в dev, а схема Strapi может вести себя иначе.
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - "5433:5432" # 5432 на хосте занят локальным PostgreSQL 18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      # postgres:18 требует монтирования на /var/lib/postgresql целиком,
      # а не на /var/lib/postgresql/data (см. комментарий в docker-compose.yml)
      - dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      # Перекрывают значения из backend/.env: dotenv не перезаписывает
      # уже установленные переменные окружения
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required in .env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required in .env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required in .env}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      STRAPI_HOT_RELOAD: "true"
      STRAPI_TELEMETRY_DISABLED: "true"
      # Docker Desktop на Windows/macOS не отдаёт события файловой системы
      # (inotify) внутрь контейнера, поэтому chokidar обязан опрашивать диск
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    ports:
      - "1338:1337" # хостовые порты отличаются от prod, чтобы оба стека работали одновременно
    volumes:
      - ./backend:/app
      - dev_backend_node_modules:/app/node_modules
      - dev_strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:1337/_health'', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s # develop поднимается долго: собирает админку

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      # Серверный fetch из контейнера фронтенда идёт по docker-сети
      STRAPI_API_URL: ${STRAPI_API_URL:-http://backend:1337}
      NEXT_TELEMETRY_DISABLED: "1"
      # Docker Desktop на Windows/macOS не отдаёт события ФС (inotify) внутрь
      # контейнера, а Turbopack их опрашивать не умеет. Поэтому в dev
      # включаем webpack + polling: `next dev` (turbopack) остаётся быстрым
      # для нативного Linux/macOS, `dev:docker` надёжным для контейнера.
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "500"
    ports:
      - "3001:3000" # см. backend
    volumes:
      - ./frontend:/app
      - dev_frontend_node_modules:/app/node_modules
      # .next тоже томами: иначе dev-сервер пишет root-файлы в рабочую папку на Windows
      - dev_frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  dev_postgres_data:
  dev_strapi_uploads:
  dev_backend_node_modules:
  dev_frontend_node_modules:
  dev_frontend_next:
