[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
priority=10
user=postgres
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main -c config_file=/etc/postgresql/15/main/postgresql.conf
autorestart=true
startsecs=5

[program:strapi]
priority=20
command=/app/scripts/boot-backend.sh
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true

[program:nextjs]
priority=30
command=/app/scripts/boot-frontend.sh
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true